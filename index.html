<!DOCTYPE html>
<html>
<head>
<title>For My Valentina ❤️</title>

<style>
body {
  text-align: center;
  background: linear-gradient(to bottom right, #ff9ecf, #ffc0cb);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

h1 {
  margin-top: 80px;
  font-size: 40px;
  color: white;
}

p {
  font-size: 20px;
  color: white;
}

button {
  font-size: 20px;
  padding: 12px 25px;
  margin: 20px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

#yesBtn {
  background-color: #ff4d6d;
  color: white;
}

#noBtn {
  background-color: #444;
  color: white;
  position: relative;
}

#message {
  font-size: 28px;
  color: white;
  margin-top: 30px;
  display: none;
}

iframe {
  display: none;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: white;
  animation: float 6s linear infinite;
  font-size: 20px;
}

@keyframes float {
  from {
    transform: translateY(100vh);
    opacity: 1;
  }
  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<h1>Hi, b! Will you be my Valentina? ☺️❤️</h1>
<p>Ikaw ra gyud, wa nay lain wowwwww</p>

<button id="yesBtn" onclick="yes()">YES 😍</button>
<button id="noBtn" onmouseover="moveNo()">NO 😈</button>
<br>

<button onclick="playMusic()">Play Our Song 🎵</button>

<div id="message">YAYYYY! I love you mwamwaaa ❤️💖</div>

<iframe id="music" 
src="https://www.youtube.com/embed/pgolQacvyZo?autoplay=1&loop=1&playlist=pgolQacvyZo" 
allow="autoplay">
</iframe>

<script>
function yes() {
  document.getElementById("message").style.display = "block";
}

function moveNo() {
  var button = document.getElementById("noBtn");
  button.style.position = "absolute";
  button.style.top = Math.random() * window.innerHeight + "px";
  button.style.left = Math.random() * window.innerWidth + "px";
}

function playMusic() {
  var iframe = document.getElementById("music");
  iframe.style.display = "block";
}

/* Create floating hearts */
setInterval(function() {
  var heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}, 500);
</script>

</body>
</html>
